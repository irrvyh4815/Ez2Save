name: Web push notifications

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-push-notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 3 --max-time 90 \
            --output /dev/null \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://ez2savemore-personal-finance.vercel.app/api/send-push-notifications
