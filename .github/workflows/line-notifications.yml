name: Send LINE payment reminders

on:
  schedule:
    - cron: "0 1,13 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger payment reminders
        env:
          CRON_SECRET: ${{ secrets.EZ2SAVE_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://ez2savemore-personal-finance.vercel.app/api/line-notifications
